services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./backend
    env_file: .env
    environment: {REDIS_URL: redis://redis:6379/0}
    ports: ["8000:8000"]
    depends_on: [redis]
  worker:
    build: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    environment: {REDIS_URL: redis://redis:6379/0}
    depends_on: [redis]
  dashboard:
    build: ./frontend
    environment: {NEXT_PUBLIC_API_URL: http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [api]
